<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720">
<defs><style>.h{font:700 31px Inter,Arial,sans-serif;fill:#17233c}.sub{font:400 15px Inter,Arial,sans-serif;fill:#66718a}.ct{font:700 16px Inter,Arial,sans-serif;fill:#17233c}.tx{font:400 13px Inter,Arial,sans-serif;fill:#40506b}.sm{font:700 11px Inter,Arial,sans-serif;letter-spacing:1px}.num{font:800 13px Inter,Arial,sans-serif;fill:white}.arr{stroke:#8fa0bb;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}</style></defs>
<rect width="1440" height="720" fill="#f5f7fb"/>
<text x="54" y="59" class="h">TraceNote | Evidence-first research workflow</text><text x="54" y="88" class="sub">A student team summarises research notes without letting a doubtful statistic pass unnoticed.</text>
<rect x="54" y="130" width="244" height="200" rx="18" fill="#fff" stroke="#cdd8ff" stroke-width="1.5"/><rect x="54" y="130" width="244" height="10" rx="5" fill="#4167ed"/><circle cx="82" cy="170" r="15" fill="#4167ed"/><text x="82" y="175" text-anchor="middle" class="num">1</text><text x="108" y="175" class="ct">User &amp; question</text><text x="76" y="215" class="tx"><tspan x="76" dy="0">Student project team</tspan><tspan x="76" dy="22">States a question, pastes</tspan><tspan x="76" dy="20">approved notes, sets context.</tspan></text><rect x="76" y="281" width="195" height="28" rx="8" fill="#edf2ff"/><text x="173" y="299" text-anchor="middle" class="sm" fill="#305de8">NOTES / DRAFT TEXT</text>
<path d="M303 230 H328 M320 222 L328 230 L320 238" class="arr"/>
<rect x="337" y="130" width="244" height="200" rx="18" fill="#fff" stroke="#b8ead9" stroke-width="1.5"/><rect x="337" y="130" width="244" height="10" rx="5" fill="#16876f"/><circle cx="365" cy="170" r="15" fill="#16876f"/><text x="365" y="175" text-anchor="middle" class="num">2</text><text x="391" y="175" class="ct">Prepare &amp; extract</text><text x="359" y="215" class="tx"><tspan x="359" dy="0">Split into source statements</tspan><tspan x="359" dy="22">Find signals, numbers, limits</tspan><tspan x="359" dy="20">and explicit action items.</tspan></text><rect x="359" y="281" width="198" height="28" rx="8" fill="#eaf8f3"/><text x="458" y="299" text-anchor="middle" class="sm" fill="#137c68">KEEP SOURCE IDS</text>
<path d="M586 230 H611 M603 222 L611 230 L603 238" class="arr"/>
<rect x="620" y="130" width="244" height="200" rx="18" fill="#fff" stroke="#ddd4ff" stroke-width="1.5"/><rect x="620" y="130" width="244" height="10" rx="5" fill="#7658db"/><circle cx="648" cy="170" r="15" fill="#7658db"/><text x="648" y="175" text-anchor="middle" class="num">3</text><text x="674" y="175" class="ct">Compare &amp; flag</text><text x="642" y="215" class="tx"><tspan x="642" dy="0">Compare same-topic claims.</tspan><tspan x="642" dy="22">Keep draft and raw evidence</tspan><tspan x="642" dy="20">side by side if they disagree.</tspan></text><rect x="642" y="281" width="198" height="28" rx="8" fill="#f2efff"/><text x="741" y="299" text-anchor="middle" class="sm" fill="#6c4dd8">NO SILENT CORRECTION</text>
<path d="M869 230 H894 M886 222 L894 230 L886 238" class="arr"/>
<rect x="903" y="130" width="244" height="200" rx="18" fill="#fff" stroke="#f2dfb8" stroke-width="1.5"/><rect x="903" y="130" width="244" height="10" rx="5" fill="#d38a18"/><circle cx="931" cy="170" r="15" fill="#d38a18"/><text x="931" y="175" text-anchor="middle" class="num">4</text><text x="957" y="175" class="ct">Build a brief</text><text x="925" y="215" class="tx"><tspan x="925" dy="0">Observations + caveats</tspan><tspan x="925" dy="22">Quoted evidence + next steps</tspan><tspan x="925" dy="20">Export as a review draft.</tspan></text><rect x="925" y="281" width="198" height="28" rx="8" fill="#fff4de"/><text x="1024" y="299" text-anchor="middle" class="sm" fill="#9a5c0a">CLAIMS WITH PROVENANCE</text>
<path d="M1152 230 H1177 M1169 222 L1177 230 L1169 238" class="arr"/>
<rect x="1186" y="130" width="200" height="200" rx="18" fill="#fff" stroke="#cde9df" stroke-width="1.5"/><rect x="1186" y="130" width="200" height="10" rx="5" fill="#16876f"/><circle cx="1214" cy="170" r="15" fill="#16876f"/><text x="1214" y="175" text-anchor="middle" class="num">5</text><text x="1240" y="175" class="ct">Human sign-off</text><text x="1208" y="215" class="tx"><tspan x="1208" dy="0">Verify original source.</tspan><tspan x="1208" dy="22">Approve, edit, reject</tspan><tspan x="1208" dy="20">or request more evidence.</tspan></text><rect x="1208" y="281" width="156" height="28" rx="8" fill="#eaf8f3"/><text x="1286" y="299" text-anchor="middle" class="sm" fill="#137c68">PERSON OWNS DECISION</text>
<rect x="54" y="370" width="425" height="264" rx="18" fill="#fff" stroke="#f0d0d0" stroke-width="1.5"/><text x="78" y="407" class="sm" fill="#b53942">EXAMPLE · REVIEW TRIGGER</text><text x="78" y="445" class="ct">The draft says 72%.</text><text x="78" y="476" class="ct">The raw note says 43%.</text><text x="78" y="515" class="tx"><tspan x="78" dy="0">Both refer to reminder emails. TraceNote preserves</tspan><tspan x="78" dy="21">both excerpts, marks the brief “Review required”,</tspan><tspan x="78" dy="21">and asks a teammate to check the original data.</tspan></text><rect x="78" y="581" width="258" height="28" rx="8" fill="#fff0f0"/><text x="207" y="599" text-anchor="middle" class="sm" fill="#b53942">NO GUESS · NO AVERAGING</text>
<rect x="500" y="370" width="425" height="264" rx="18" fill="#fff" stroke="#cdd8ff" stroke-width="1.5"/><text x="524" y="407" class="sm" fill="#305de8">EVALUATION EXAMPLES</text><text x="524" y="445" class="ct">Measure behaviour, not vibes.</text><text x="524" y="481" class="tx"><tspan x="524" dy="0">• Evidence coverage target ≥ 90%</tspan><tspan x="524" dy="26">• Seeded conflict recall target 100%</tspan><tspan x="524" dy="26">• Human usefulness rating target ≥ 4/5</tspan><tspan x="524" dy="26">• Unsafe release rate target = 0</tspan></text><text x="524" y="602" class="sub" style="font-size:11px">Targets only; collect real measurements in a pilot.</text>
<rect x="946" y="370" width="440" height="264" rx="18" fill="#fff" stroke="#b8ead9" stroke-width="1.5"/><text x="970" y="407" class="sm" fill="#137c68">BOUNDARIES BY DESIGN</text><text x="970" y="445" class="ct">Private by default. Human-owned decisions.</text><text x="970" y="481" class="tx"><tspan x="970" dy="0">• Demo runs locally; no API call or persistent save.</tspan><tspan x="970" dy="26">• Redact common contact strings in output.</tspan><tspan x="970" dy="26">• Route conflicts, ambiguity and sensitive cases</tspan><tspan x="986" dy="19">to an authorised teammate for review.</tspan><tspan x="970" dy="26">• Real deployment needs consent, access control,</tspan><tspan x="986" dy="19">retention rules and a tested evaluation set.</tspan></text>
<text x="54" y="678" class="sub" style="font-size:11px">TraceNote is an interview prototype. The included HTML uses deterministic rules, not a connected live LLM; this is disclosed deliberately.</text>
</svg>